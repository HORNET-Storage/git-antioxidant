lints.workspace = true

[package]
name = "gix-bitmap"
version = "0.6.1"
repository = "https://github.com/HORNET-Storage/git-antioxidant"
publish = false
license = "MIT OR Apache-2.0"
description = "A crate of git-antioxidant dedicated to implementing the standard git bitmap format"
authors = ["Sebastian Thiel <sebastian.thiel@icloud.com>"]
edition = "2024"
rust-version = "1.88"
include = ["/src/**/*", "/LICENSE-*"]

[lib]
doctest = true
test = true

[dependencies]
gix-error = { version = "^0.5.2", path = "../gix-error" }

[dev-dependencies]
gix-testtools = { path = "../tests/tools", default-features = false }
