lints.workspace = true

[package]
name = "gix-worktree-state"
version = "0.36.0"
repository = "https://github.com/GitoxideLabs/gitoxide"
license = "MIT OR Apache-2.0"
description = "A crate of the gitoxide project implementing setting the worktree to a particular state"
authors = ["Sebastian Thiel <sebastian.thiel@icloud.com>"]
edition = "2024"
include = ["/src/**/*", "/LICENSE-*"]
rust-version = "1.88"

[lib]
doctest = false

[features]
## Enable support for the SHA-1 hash by forwarding the feature to dependencies.
sha1 = ["gix-index/sha1"]
## Enable support for the SHA-256 hash by forwarding the feature to dependencies.
sha256 = ["gix-index/sha256"]
## Switch an index and its worktree from one tree to another, as `git read-tree -m -u` does when `git switch` and
## `git checkout` change branches. This compares the worktree with the index and looks for untracked files.
switch = ["dep:gix-diff", "dep:gix-dir", "dep:gix-hash", "dep:gix-pathspec", "dep:gix-status", "dep:filetime"]

[dependencies]
gix-trace = { version = "^0.3.0", path = "../gix-trace" }
gix-utils = { version = "^0.5.1", path = "../gix-utils", features = ["interrupt", "progress"] }
gix-parallel = { version = "^0.50.0", path = "../gix-parallel" }
gix-worktree = { version = "^0.58.0", path = "../gix-worktree", default-features = false, features = ["attributes"] }
gix-index = { version = "^0.57.0", path = "../gix-index" }
gix-fs = { version = "^0.24.0", path = "../gix-fs" }
gix-object = { version = "^0.66.0", path = "../gix-object" }
gix-error = { version = "^0.5.1", path = "../gix-error", features = ["bstr"] }
gix-path = { version = "^0.14.0", path = "../gix-path" }
gix-filter = { version = "^0.36.0", path = "../gix-filter" }

gix-diff = { version = "^0.69.0", path = "../gix-diff", default-features = false, optional = true }
gix-dir = { version = "^0.31.0", path = "../gix-dir", optional = true }
gix-hash = { version = "^0.28.0", path = "../gix-hash", optional = true }
gix-pathspec = { version = "^0.22.0", path = "../gix-pathspec", optional = true }
gix-status = { version = "^0.36.0", path = "../gix-status", optional = true }

io-close = "0.3.7"
bstr = { version = "1.12.0", default-features = false }
filetime = { version = "0.2.29", optional = true }

[dev-dependencies]
insta = "1.46.3"
gix-worktree-state = { path = ".", features = ["sha1", "sha256", "switch"] }
gix-object = { path = "../gix-object" }
gix-filter = { path = "../gix-filter" }
gix-index = { path = "../gix-index", features = ["sha1", "sha256"] }
gix-hash = { path = "../gix-hash", features = ["sha1", "sha256"] }
gix-fs = { path = "../gix-fs" }
gix-testtools = { path = "../tests/tools", default-features = false, features = ["sha1", "sha256"] }
gix-odb = { path = "../gix-odb", features = ["sha1", "sha256"] }
gix-attributes = { path = "../gix-attributes" }
gix-config = { path = "../gix-config" }
gix-ignore = { path = "../gix-ignore" }
walkdir = "2.3.2"
pretty_assertions = "1.4.0"

[package.metadata.docs.rs]
features = ["sha1", "switch"]
