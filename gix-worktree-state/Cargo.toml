lints.workspace = true

[package]
name = "gix-worktree-state"
version = "0.37.0"
repository = "https://github.com/HORNET-Storage/git-antioxidant"
publish = false
license = "MIT OR Apache-2.0"
description = "A crate of git-antioxidant implementing setting the worktree to a particular state"
authors = ["Sebastian Thiel <sebastian.thiel@icloud.com>"]
edition = "2024"
include = ["/src/**/*", "/LICENSE-*"]
rust-version = "1.88"

[lib]
doctest = false

[features]
## Enable support for the SHA-1 hash by forwarding the feature to dependencies.
sha1 = ["gix-index/sha1"]
## Enable support for the SHA-256 hash by forwarding the feature to dependencies.
sha256 = ["gix-index/sha256"]
## Switch an index and its worktree from one tree to another, as `git read-tree -m -u` does when `git switch` and
## `git checkout` change branches. This compares the worktree with the index and looks for untracked files.
switch = ["dep:gix-diff", "dep:gix-dir", "dep:gix-hash", "dep:gix-pathspec", "dep:gix-status", "dep:filetime"]
## Reset an index and its worktree to a tree as `git reset` does with `--mixed`, `--hard`, `--merge` and `--keep`, and the
## entries of the paths of a pathspec as `git reset <tree-ish> -- <pathspec>` does, beside `switch`.
reset = ["switch"]

[dependencies]
gix-trace = { version = "^0.3.1", path = "../gix-trace" }
gix-utils = { version = "^0.5.2", path = "../gix-utils", features = ["interrupt", "progress"] }
gix-parallel = { version = "^0.50.1", path = "../gix-parallel" }
gix-worktree = { version = "^0.59.0", path = "../gix-worktree", default-features = false, features = ["attributes"] }
gix-index = { version = "^0.58.0", path = "../gix-index" }
gix-fs = { version = "^0.24.1", path = "../gix-fs" }
gix-object = { version = "^0.66.1", path = "../gix-object" }
gix-error = { version = "^0.5.2", path = "../gix-error", features = ["bstr"] }
gix-path = { version = "^0.14.1", path = "../gix-path" }
gix-filter = { version = "^0.36.1", path = "../gix-filter" }

gix-diff = { version = "^0.70.0", path = "../gix-diff", default-features = false, optional = true }
gix-dir = { version = "^0.32.0", path = "../gix-dir", optional = true }
gix-hash = { version = "^0.28.0", path = "../gix-hash", optional = true }
gix-pathspec = { version = "^0.22.0", path = "../gix-pathspec", optional = true }
gix-status = { version = "^0.37.0", path = "../gix-status", optional = true }

io-close = "0.3.7"
bstr = { version = "1.12.0", default-features = false }
filetime = { version = "0.2.29", optional = true }

[dev-dependencies]
insta = "1.46.3"
gix-worktree-state = { path = ".", features = ["sha1", "sha256", "switch", "reset"] }
gix-object = { path = "../gix-object" }
gix-filter = { path = "../gix-filter" }
gix-index = { path = "../gix-index", features = ["sha1", "sha256"] }
gix-hash = { path = "../gix-hash", features = ["sha1", "sha256"] }
gix-fs = { path = "../gix-fs" }
gix-testtools = { path = "../tests/tools", default-features = false, features = ["sha1", "sha256"] }
gix-odb = { path = "../gix-odb", features = ["sha1", "sha256"] }
gix-attributes = { path = "../gix-attributes" }
gix-config = { path = "../gix-config" }
gix-ignore = { path = "../gix-ignore" }
walkdir = "2.3.2"
pretty_assertions = "1.4.0"

[package.metadata.docs.rs]
features = ["sha1", "switch", "reset"]
