lints.workspace = true

[package]
name = "gix-switch"
version = "0.0.0"
repository = "https://github.com/GitoxideLabs/gitoxide"
license = "MIT OR Apache-2.0"
description = "A crate of the gitoxide project to switch an index and its worktree from one tree to another as git read-tree -m -u does"
authors = ["Colby Serpa", "Sebastian Thiel <sebastian.thiel@icloud.com>"]
edition = "2024"
include = ["/src/**/*", "/LICENSE-*"]
rust-version = "1.88"

[lib]
doctest = false

[features]
## Enable support for the SHA-1 hash by forwarding the feature to dependencies.
sha1 = ["gix-hash/sha1"]
## Enable support for the SHA-256 hash by forwarding the feature to dependencies.
sha256 = ["gix-hash/sha256"]

[dependencies]
gix-diff = { version = "^0.69.0", path = "../gix-diff", default-features = false }
gix-dir = { version = "^0.31.0", path = "../gix-dir" }
gix-error = { version = "^0.5.1", path = "../gix-error" }
gix-fs = { version = "^0.24.0", path = "../gix-fs" }
gix-hash = { version = "^0.28.0", path = "../gix-hash" }
gix-index = { version = "^0.57.0", path = "../gix-index" }
gix-object = { version = "^0.66.0", path = "../gix-object" }
gix-path = { version = "^0.14.0", path = "../gix-path" }
gix-pathspec = { version = "^0.22.0", path = "../gix-pathspec" }
gix-status = { version = "^0.36.0", path = "../gix-status" }
gix-trace = { version = "^0.3.0", path = "../gix-trace" }
gix-utils = { version = "^0.5.1", path = "../gix-utils", features = ["progress"] }
gix-worktree = { version = "^0.58.0", path = "../gix-worktree", default-features = false, features = ["attributes"] }
gix-worktree-state = { version = "^0.36.0", path = "../gix-worktree-state" }
gix-write-tree = { version = "^0.0.0", path = "../gix-write-tree" }

bstr = { version = "1.12.0", default-features = false }
filetime = "0.2.29"

[dev-dependencies]
gix-attributes = { path = "../gix-attributes" }
gix-config = { path = "../gix-config" }
gix-filter = { path = "../gix-filter" }
gix-ignore = { path = "../gix-ignore" }
gix-odb = { path = "../gix-odb", features = ["sha1", "sha256"] }
gix-parallel = { path = "../gix-parallel", features = ["parallel"] }
gix-testtools = { path = "../tests/tools" }
pretty_assertions = "1.4.0"

[package.metadata.docs.rs]
features = ["sha1"]
